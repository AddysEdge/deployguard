<text x="24" y="130" fill="#e2e8f0"></text>
<text x="24" y="152" fill="#93c5fd">$ deployguard compare  # clean synthetic candidate</text>
<text x="24" y="174" fill="#e2e8f0">DeployGuard v0.1.0  run 3954f79fa59e3663</text>
<text x="24" y="196" fill="#e2e8f0">  baseline   http://127.0.0.1:45975</text>
<text x="24" y="218" fill="#e2e8f0">  candidate  http://127.0.0.1:34797</text>
