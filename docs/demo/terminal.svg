<text x="24" y="262" fill="#e2e8f0">ed, 0.0s</text>
<text x="24" y="284" fill="#e2e8f0"></text>
<text x="24" y="306" fill="#86efac">PASS         get-user  GET /api/users/42</text>
<text x="24" y="328" fill="#86efac">  behavior     PASS         candidate matched baseline (status 200, application/json)</text>
<text x="24" y="350" fill="#e2e8f0">  performance  SKIPPED      not configured for this scenario</text>
<text x="24" y="372" fill="#e2e8f0"></text>
