name: Published binary demo

on:
  push:
    branches: [main]
    paths:
      - 'scripts/demo-release.mjs'
      - 'scripts/render-demo.mjs'
      - '.github/workflows/published-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Select the native release bundle
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const os = process.platform === 'win32' ? 'windows' : process.platform;
          const arch = process.arch === 'x64' ? 'amd64' : process.arch;
          appendFileSync(process.env.GITHUB_ENV, 'BUNDLE=deployguard_v0.1.0_' + os + '_' + arch + '.tar.gz\n');
          JS
      - name: Download and verify the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-bundle"
          gh release download v0.1.0 --repo AddysEdge/deployguard --pattern "$BUNDLE" --pattern checksums.txt --dir "$RUNNER_TEMP/release-bundle"
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          const dir = path.join(process.env.RUNNER_TEMP, 'release-bundle');
          const entries = readFileSync(path.join(dir, 'checksums.txt'), 'utf8').trim().split(/\r?\n/);
          const entry = entries.find(line => line.endsWith(process.env.BUNDLE));
          if (!entry) throw new Error('Missing bundle checksum');
          const expected = entry.split(/\s+/)[0];
          const actual = createHash('sha256').update(readFileSync(path.join(dir, process.env.BUNDLE))).digest('hex');
          if (actual !== expected) throw new Error('Bundle checksum mismatch');
          const tar = process.platform === 'win32' ? path.join(process.env.SystemRoot, 'System32', 'tar.exe') : 'tar';
          execFileSync(tar, ['-xzf', path.join(dir, process.env.BUNDLE), '-C', dir], { stdio: 'inherit' });
          JS
      - name: Run the executable against clean and regressed local APIs
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          node scripts/demo-release.mjs --binary "$RUNNER_TEMP/release-bundle/deployguard$suffix" --out "$RUNNER_TEMP/demo"
          node scripts/render-demo.mjs "$RUNNER_TEMP/demo"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-${{ runner.os }}
          path: ${{ runner.temp }}/demo
          if-no-files-found: error
