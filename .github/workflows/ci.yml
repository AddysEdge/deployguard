name: CI

# Normal CI: build, vet, test (including the race detector) and verify the
# seeded regression evaluation. Detecting the intentionally regressed fixture
# is an asserted, expected result here, so this workflow stays green when
# DeployGuard works correctly.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (ubuntu, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Seeded regression evaluation
        run: go run ./cmd/dg-eval --out reports/eval.json

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployguard-eval
          path: reports/eval.json
          if-no-files-found: warn

  test-windows:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
